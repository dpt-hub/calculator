<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>The Ugly (but functional!) Calculator</h1>
    <div id="calculatorBody">
        <div id="display"></div>
        <div id="buttons">
            <div class="box-button"><button id="zero" class="numbers button">0</button></div>
            <div class="box-button"><button id="one" class="numbers button">1</button></div>
            <div class="box-button"><button id="two" class="numbers button">2</button></div>
            <div class="box-button"><button id="three" class="numbers button">3</button></div>
            <div class="box-button"><button id="four" class="numbers button">4</button></div>
            <div class="box-button"><button id="five" class="numbers button">5</button></div>
            <div class="box-button"><button id="six" class="numbers button">6</button></div>
            <div class="box-button"><button id="seven" class="numbers button">7</button></div>
            <div class="box-button"><button id="eight" class="numbers button">8</button></div>
            <div class="box-button"><button id="nine" class="numbers button">9</button></div>
            <div class="box-button"><button id="decimal" class="decimal button">.</button></div>
            <div class="box-button"><button id="plus" class="operators button">+</button></div>
            <div class="box-button"><button id="minus" class="operators button">-</button></div>
            <div class="box-button"><button id="multiply" class="operators button">*</button></div>
            <div class="box-button"><button id="divide" class="operators button">/</button></div>
            <div class="box-button"><button id="equals" class="special button">=</button></div>
            <div class="box-button"><button id="clear" class="special button">Clear</button></div>
            <div class="box-button"><button id="backspace" class="special button"><---</button></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
